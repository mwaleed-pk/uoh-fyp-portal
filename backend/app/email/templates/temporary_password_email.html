<!doctype html>
<html><body style="font-family:Arial,sans-serif;background:#f4f7fb;padding:28px;color:#172033">
  <div style="max-width:560px;margin:auto;background:white;padding:30px;border-radius:12px">
    <h2>{{ portal_name }} password recovery</h2>
    <p>Hello {{ name }},</p>
    <p>Your email was verified. Use this temporary password to sign in:</p>
    <p style="font-size:22px;font-weight:bold;letter-spacing:2px;background:#eef4ff;padding:14px;text-align:center;border-radius:8px">{{ temporary_password }}</p>
    <p>For security, change it after signing in. If you did not request this, contact the portal administrator.</p>
    <p><a href="{{ portal_url }}">Open {{ portal_name }}</a></p>
  </div>
</body></html>
